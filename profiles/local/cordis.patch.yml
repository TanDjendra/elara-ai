# Generated by scripts/bootstrap-local.ps1.
# The paths are absolute so the DSH plugin loader does not resolve them
# relative to its own profile directory.
- insert:
    - id: elara-access
      name: 'D:/Tan/script/elara-ai/plugins/elara-access.ts'
    - id: elara-control
      name: 'D:/Tan/script/elara-ai/plugins/elara-control.ts'
    - id: elara-core
      name: 'D:/Tan/script/elara-ai/plugins/elara-core.ts'
    - id: elara-memory
      name: 'D:/Tan/script/elara-ai/plugins/elara-memory.ts'
    - id: elara-windows-tools
      name: 'D:/Tan/script/elara-ai/plugins/windows-tools.ts'
    - id: whatsapp-baileys
      name: 'D:/Tan/script/elara-ai/channels/whatsapp-baileys/plugin.ts'
    - id: dashboard-api
      name: 'D:/Tan/script/elara-ai/plugins/dashboard-api.ts'
    - id: companion-api
      name: 'D:/Tan/script/elara-ai/plugins/companion-api.ts'
    - id: web
      name: '@deepseek-ai/dsh-web'
    - id: tool-web
      name: '@deepseek-ai/dsh-tool-web'
    - id: web-search-deepseek
      name: '@deepseek-ai/dsh-web-search-deepseek'
      config:
        baseURL: 'http://localhost:20128/v1'
        apiKeyEnv: 'NINEROUTER_KEY'
        model: 'deepseek-v4-flash' # fallback, can be overridden by settings
    - id: web-fetch-http
      name: '@deepseek-ai/dsh-web-fetch-http'
- modify:
    - id: system-prompt
      config:
        personaPrefix: |
          You are ELARA, a female-presenting personal AI assistant.
          Speak natural everyday Indonesian in casual chat. Follow the preceding conversation and match its tone.
          Most casual replies need only a few sentences, but use enough detail when the question needs it.
          Do not automatically explain, advise, summarize, offer help, or ask a follow-up question.
          Vary reactions and wording. Do not use "wkwk" in your own replies or force laughter, emojis, slang, drama, or CAPSLOCK.
          Most replies need no emoji. In fitting casual moments, use at most one soft, familiar emoji such as 🥹, 🤭, 🫶, 🤍, or 😭; vary it with the meaning, not a fixed pattern. Serious and technical replies usually need none.
          Mostly use lowercase and light chat punctuation. Avoid em dashes and semicolons in casual replies.
          Keep technical details accurate and do not invent actions, results, physical experiences, or emotions.
- id: agent-presets
  config:
    default: elara
    roots:
      - path: 'D:/Tan/script/elara-ai/profiles/local/.agent-presets'
        trust: system
